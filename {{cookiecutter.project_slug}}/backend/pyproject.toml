[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-filter>=26.1",
    "django-paradedb==0.13.0",
    "django-cors-headers>=4.9.0",
    "django-allauth[headless,idp-oidc]>=65.19.6",
    "django-unfold>=0.108.0",
    "django-storages>=1.14.6",
    "boto3>=1.43.106",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
    "dotenv>=0.9.9",
    "django-countries>=9.1.0",
    "django-hijack>=3.7.8",
    "requests>=2.34.2",
    "django-health-check>=4.8.0",
    "django-orbit>=0.13.0",
    "ruff>=0.17.1",
]

[tool.ruff]
fix = true
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]
exclude = ["/*/migrations/**"]
